# End users: see README.md (generate-env.sh → docker compose up -d).
# Maintainer build+push: ./scripts/publish-image.sh
# Image: https://hub.docker.com/r/sami1367/ai-worker
# Override: AI_WORKER_IMAGE=sami1367/ai-worker:latest docker compose up -d
#
# No default secrets are shipped. Run ./scripts/generate-env.sh before the first up.
# After the first successful start, secrets are persisted on the data volume
# (/data/config/app-secrets.env) and the host .env may be removed.

x-env: &env
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
  NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
  WORKER_INTERNAL_TOKEN: ${WORKER_INTERNAL_TOKEN:-}
  INITIAL_ADMIN_BOOTSTRAP_SECRET: ${INITIAL_ADMIN_BOOTSTRAP_SECRET:-}
  APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8080}
  WEB_INTERNAL_URL: http://web:3000
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITLAB_HOST: ${GITLAB_HOST:-}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  # AI provider keys (optional — same as Providers UI; web exports them for the worker)
  CURSOR_API_KEY: ${CURSOR_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CODEX_API_KEY: ${CODEX_API_KEY:-}
  WORKERS: ${WORKERS:-1}
  CHECK_INTERVAL: ${CHECK_INTERVAL:-30}
  POLL_CONCURRENCY: ${POLL_CONCURRENCY:-5}
  REPO_CLAIM_TTL_SECONDS: ${REPO_CLAIM_TTL_SECONDS:-10}

x-app: &app
  image: ${AI_WORKER_IMAGE:-sami1367/ai-worker:1.0.0}
  environment: *env
  volumes:
    - data:/data
  networks:
    - internal

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiworker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: aiworker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworker -d aiworker"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "--import", "tsx", "database/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 30s
    mem_limit: 1g

  worker:
    <<: *app
    restart: unless-stopped
    command: ["bash", "/app/scripts/worker-entrypoint.sh"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/config/logs/platform-wrapper.log && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 120s
    mem_limit: 2g

networks:
  internal:

volumes:
  pgdata:
  data:
