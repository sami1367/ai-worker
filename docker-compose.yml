services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aiworker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiworker} -d ${POSTGRES_DB:-aiworker}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal
    # Not published publicly by default

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["node", "--import", "tsx", "database/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOST: 0.0.0.0
      PORT: 3000
      AI_WORKER_BASE_DIR: /data/config
      WORKSPACE_ROOT: /data/workspaces
      LOGS_DIR: /data/logs
      STATE_DIR: /data/state
      CONFIG_DIR: /data/config
      HOME: /home/appuser
      PATH: /home/appuser/.local/bin:/home/appuser/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:3000"
    volumes:
      - configdata:/data/config
      - workspaces:/data/workspaces
      - logsdata:/data/logs
      - statedata:/data/state
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - internal
    stop_grace_period: 30s
    mem_limit: 1g

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WEB_INTERNAL_URL: http://web:3000
      AI_WORKER_BASE_DIR: /data/config
      WORKSPACE_ROOT: /data/workspaces
      LOGS_DIR: /data/logs
      STATE_DIR: /data/state
      CONFIG_DIR: /data/config
      # Ensure Cursor/Claude CLIs (installed under ~/.local/bin) are on PATH
      PATH: /home/appuser/.local/bin:/home/appuser/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HOME: /home/appuser
    command: ["bash", "/app/scripts/worker-entrypoint.sh"]
    volumes:
      - configdata:/data/config
      - workspaces:/data/workspaces
      - logsdata:/data/logs
      - statedata:/data/state
      # Optional: mount host forge CLI config (document in README)
      # - ${HOME}/.config/gh:/home/appuser/.config/gh:ro
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
    stop_grace_period: 120s
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/config/logs/platform-wrapper.log && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  configdata:
  workspaces:
  logsdata:
  statedata:
