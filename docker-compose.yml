# End users: download ONLY this file (no git clone), then: docker compose up -d
#   curl -fsSL -o docker-compose.yml \
#     https://raw.githubusercontent.com/sami1367/ai-worker/main/docker-compose.yml
# Maintainer build+push: ./scripts/publish-image.sh
# Image: https://hub.docker.com/r/sami1367/ai-worker
# Override: AI_WORKER_IMAGE=sami1367/ai-worker:1.0.0 docker compose up -d

x-env: &env
  DATABASE_URL: postgresql://aiworker:Aw7kP9mX2qR5vN8jL3hC6tY1wE4uS0bZ@db:5432/aiworker
  NUXT_SESSION_PASSWORD: n8Kx2mQ7pL4vR9wT1yH6jC3bF5dA0sE2uZ
  SECRET_ENCRYPTION_KEY: a1b2c3d4e5f60718293a4b5c6d7e8f90112233445566778899aabbccddeeff00
  WORKER_INTERNAL_TOKEN: wk_7f3a9c2e1b8d4f6a0e5c9b2d7a1f4e8c3b6d9e0a2f5c8
  INITIAL_ADMIN_BOOTSTRAP_SECRET: ${INITIAL_ADMIN_BOOTSTRAP_SECRET:-changeme}
  APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8080}
  WEB_INTERNAL_URL: http://web:3000
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITLAB_HOST: ${GITLAB_HOST:-}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  WORKERS: ${WORKERS:-1}
  CHECK_INTERVAL: ${CHECK_INTERVAL:-30}
  POLL_CONCURRENCY: ${POLL_CONCURRENCY:-5}
  REPO_CLAIM_TTL_SECONDS: ${REPO_CLAIM_TTL_SECONDS:-10}

x-app: &app
  image: ${AI_WORKER_IMAGE:-sami1367/ai-worker:latest}
  environment: *env
  volumes:
    - data:/data
  networks:
    - internal

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiworker
      POSTGRES_PASSWORD: Aw7kP9mX2qR5vN8jL3hC6tY1wE4uS0bZ
      POSTGRES_DB: aiworker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworker -d aiworker"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "--import", "tsx", "database/migrate.ts"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    stop_grace_period: 30s
    mem_limit: 1g

  worker:
    <<: *app
    restart: unless-stopped
    command: ["bash", "/app/scripts/worker-entrypoint.sh"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/config/logs/platform-wrapper.log && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    stop_grace_period: 120s
    mem_limit: 2g

networks:
  internal:

volumes:
  pgdata:
  data:
